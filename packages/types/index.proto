syntax = "proto3";

package safety_web;

// Safety-web summary-related messages

// Summary is tied to a package, not a repo.
message PackageSummary {
  string summaryVersion = 1;  // Version of the summary format definition
  string packageName = 2;
  string packageVersion = 3;
  string packagePath = 4;  // Relative path of the package in the repository
  Repository repository = 5;  // Metadata about the repository scanned
  repeated Violation violations = 6;
}

message Repository {
  string url = 1;
  optional string commitId = 2;
}

enum ConfidenceLevel {
  VIOLATION = 0;
  MEDIUM_POTENTIAL_VIOLATION = 1;
  LOW_POTENTIAL_VIOLATION = 2;
}

// These messages are not stable and may still be changed in a breaking way
// while we figure out what's useful.
message Violation {
  string category = 1;  // Free form string, but is more of an enum. e.g. all TT violations should be "trusted-types"
  string rule_id = 2;  // e.g. "ban-element-innerhtml-assignments"
  ConfidenceLevel confidence = 3;
  Location location = 5;
  optional Exemption exemption = 6;
}

message Location {
  string filepath = 1;
  int32 line = 2;
  int32 column = 3;
  int32 end_line = 4;
  int32 end_column = 5;
}

message Exemption {
  ExemptionType type = 1;
  string justification = 2;
}

enum ExemptionType {
  UNKNOWN_TYPE = 0;
  ALLOWLISTED = 1;  // Violation is tracked in a safety-web allowlist
  ESLINT_SILENCED = 2;  // Violation is silenced using ESLint comments
}
